<style>:root {
  --topo: #171d1a; --fundo: #1c2320; --painel: #1f2723; --painel2: #232c27; --cab: #19201c;
  --linha: #2c3631; --linha2: #3a4640; --texto: #e7ebe6; --suave: #a9b4ad; --fraco: #8b978f;
  --acento: #e5a54b; --acento-t: rgba(229,165,75,.14); --verde: #9fc7a6; --azul: #9cc4ea;
  --claro: #e9ece4; --escuro: #86a291;
  --serifa: 'Fraunces', Georgia, serif;
  font-family: 'DM Sans', 'Segoe UI', system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--fundo); color: var(--texto); font-size: 14px; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--acento); }
:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg { flex: none; }
[hidden] { display: none !important; }

/* ---------- topo ---------- */
.topo { position: relative; z-index: 30; display: flex; align-items: center; gap: 2px; height: 46px; padding: 0 10px 0 12px; background: var(--topo); border-bottom: 1px solid var(--linha); }
.marca { display: flex; align-items: center; gap: 8px; margin-right: 12px; color: #fff; font-weight: 700; font-size: 16px; letter-spacing: -.02em; text-decoration: none; }
.marca svg { width: 26px; height: 26px; }
.nav { display: flex; align-items: stretch; height: 100%; }
.nav a { display: flex; align-items: center; gap: 7px; padding: 0 12px; color: var(--suave); text-decoration: none; font-size: 13px; font-weight: 600; border-bottom: 2px solid transparent; }
.nav a:hover { color: #fff; }
.nav a[aria-current="page"] { color: var(--acento); border-bottom-color: var(--acento); background: rgba(229,165,75,.05); }
.nav svg { width: 15px; height: 15px; }
.contexto { margin-left: auto; margin-right: 10px; max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; font-weight: 600; color: var(--suave); }
.menu { position: relative; }
.menu > button { display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 9px; border: 1px solid transparent; background: none; color: var(--suave); font-size: 12.5px; border-radius: 6px; }
.menu > button:hover, .menu > button[aria-expanded="true"] { color: #fff; border-color: var(--linha2); background: var(--painel); }
.menu > button svg { width: 15px; height: 15px; }
.menu > button .seta { width: 10px; height: 10px; opacity: .7; }
.lista { position: absolute; top: calc(100% + 6px); right: 0; min-width: 250px; padding: 6px; background: #1d2521; border: 1px solid var(--linha2); border-radius: 8px; box-shadow: 0 18px 40px rgba(0,0,0,.5); z-index: 40; animation: sobe .16s ease both; }
.lista button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: 0; background: none; color: #dfe5df; text-align: left; font-size: 13px; border-radius: 5px; white-space: nowrap; }
.lista button:hover, .lista button:focus-visible { background: var(--acento-t); color: #fff; outline: none; }
.lista .mk { width: 14px; color: var(--acento); font-weight: 700; }
.lista hr { border: 0; border-top: 1px solid var(--linha); margin: 5px 4px; }
.lista small { margin-left: auto; color: var(--fraco); font-size: 11.5px; }
@keyframes sobe { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

/* ---------- areas ---------- */
.vista { position: absolute; inset: 46px 0 0 0; display: flex; flex-direction: column; overflow: hidden; }
.rolavel { flex: 1; overflow: auto; }
.subabas { display: flex; gap: 6px; align-items: center; height: 44px; padding: 0 14px; background: var(--cab); border-bottom: 1px solid var(--linha); flex: none; }
.subabas button { padding: 6px 12px; border: 1px solid transparent; border-radius: 6px; background: none; color: var(--fraco); font-size: 13.5px; }
.subabas button:hover { color: #fff; }
.subabas button[aria-pressed="true"] { color: #fff; font-weight: 700; border-color: var(--linha2); background: var(--painel); }

/* ---------- biblioteca ---------- */
.pag { max-width: 1100px; margin: 0 auto; padding: 44px 40px 70px; }
.pag h1 { margin: 0; font-family: var(--serifa); font-weight: 400; font-size: 46px; letter-spacing: -.02em; color: #f3efe6; }
.pag .sub { margin: 10px 0 0; font-size: 15px; color: var(--suave); }
.acoes { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.bt { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 38px; padding: 0 14px; border: 1px solid var(--linha2); border-radius: 7px; background: none; color: var(--texto); font-size: 13.5px; font-weight: 600; white-space: nowrap; }
.bt:hover { background: var(--painel2); border-color: #4a5850; }
.bt svg { width: 16px; height: 16px; }
.bt.prim { background: var(--acento); border-color: var(--acento); color: #1d1608; }
.bt.prim:hover { filter: brightness(1.07); }
.bt.verde { background: var(--verde); border-color: var(--verde); color: #122019; }
.bt.azul { background: rgba(91,140,190,.13); border-color: rgba(124,170,214,.55); color: var(--azul); }
.bt.peq { height: 30px; padding: 0 10px; font-size: 12.5px; }
.bt:disabled { opacity: .45; cursor: default; }
.atalhos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-top: 26px; }
.cartao { display: flex; align-items: flex-start; gap: 14px; padding: 20px; border: 1px solid var(--linha2); border-radius: 10px; background: var(--painel); color: var(--texto); text-align: left; text-decoration: none; transition: border-color .2s, background-color .2s, transform .2s; }
.cartao:hover, .cartao:focus-visible { border-color: rgba(229,165,75,.6); background: var(--painel2); transform: translateY(-1px); }
.cartao .ic { color: var(--acento); margin-top: 2px; } .cartao .ic svg { width: 24px; height: 24px; }
.cartao b { display: block; font-size: 17px; color: #fff; }
.cartao span.t { display: block; margin-top: 4px; font-size: 13.5px; line-height: 1.45; color: var(--suave); }
.cartao .fl { margin-left: auto; color: var(--fraco); } .cartao .fl svg { width: 14px; height: 14px; }
.mais { margin-top: 24px; padding-bottom: 20px; border-bottom: 1px solid var(--linha); display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap; }
.mais details { flex: 1; }
.mais summary { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; list-style: none; font-size: 16px; font-weight: 600; color: #fff; }
.mais summary::-webkit-details-marker { display: none; }
.mais summary svg { width: 13px; height: 13px; transition: transform .2s; }
.mais details[open] summary svg { transform: rotate(90deg); }
.mais .acoes { margin-top: 14px; }
.busca { position: relative; width: 320px; }
.busca svg { position: absolute; left: 11px; top: 50%; width: 15px; height: 15px; margin-top: -7.5px; color: var(--fraco); pointer-events: none; }
.busca input, .campo { width: 100%; height: 36px; padding: 0 10px 0 34px; border: 1px solid var(--linha2); border-radius: 7px; background: #161c19; font-size: 13px; }
.campo { padding-left: 10px; }
.secao { margin-top: 30px; }
.secao h2 { margin: 0 0 14px; font-size: 17px; font-weight: 700; color: #fff; }
.secao-cab { display: flex; align-items: baseline; gap: 12px; }
.grade2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.partida { display: flex; align-items: center; gap: 16px; padding: 14px 16px; border: 1px solid var(--linha2); border-radius: 10px; background: var(--painel); color: var(--texto); text-align: left; transition: border-color .2s, background-color .2s; }
.partida:hover, .partida:focus-visible { border-color: rgba(229,165,75,.6); background: var(--painel2); }
.mini { flex: none; padding: 5px; border-radius: 6px; background: #141a17; display: flex; }
.mini svg { width: 104px; height: 104px; display: block; border-radius: 2px; }
.partida .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.partida small { font-size: 12px; color: var(--acento); }
.partida b { font-size: 15px; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.partida span.t { font-size: 13px; color: var(--suave); line-height: 1.45; }
.vazio { color: var(--fraco); font-size: 14px; }
.rodape { margin-top: 30px; font-size: 12.5px; color: var(--fraco); }

/* bases */
.bases { flex: 1; display: flex; min-height: 0; }
.bases aside { width: 250px; flex: none; padding: 18px 14px; border-right: 1px solid var(--linha); background: #1a211d; display: flex; flex-direction: column; gap: 8px; overflow: auto; }
.bases aside .cab { display: flex; gap: 10px; align-items: center; margin-bottom: 6px; }
.bases aside .cab b { display: block; color: #fff; font-size: 14.5px; }
.bases aside .cab small, .colecao small { display: block; color: var(--fraco); font-size: 12px; }
.bases aside h3 { margin: 12px 4px 2px; font-size: 12px; font-weight: 600; color: var(--fraco); }
.colecao { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px; border: 1px solid transparent; border-radius: 7px; background: none; text-align: left; color: var(--texto); }
.colecao:hover { background: rgba(255,255,255,.03); }
.colecao[aria-pressed="true"] { background: var(--painel2); border-color: var(--linha2); }
.colecao b { display: block; font-size: 13.5px; color: #fff; }
.colecao em { margin-left: auto; font-style: normal; font-size: 12.5px; color: var(--fraco); }
.colecao svg { width: 20px; height: 20px; color: var(--acento); }
.bases aside p { margin: 12px 4px 0; font-size: 12.5px; line-height: 1.55; color: #9dbba6; }
.bases main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--painel); }
.bases-cab { display: flex; align-items: center; gap: 14px; padding: 14px 20px; border-bottom: 1px solid var(--linha); flex-wrap: wrap; }
.bases-cab h1 { margin: 0; font-size: 22px; font-weight: 600; color: #fff; }
.bases-cab .acoes { margin: 0 0 0 auto; }
.filtro { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--linha); flex-wrap: wrap; }
.filtro .busca { flex: 1; max-width: 520px; width: auto; }
.filtro .conta { margin-left: auto; font-size: 12.5px; color: var(--fraco); }
.tabela { flex: 1; overflow: auto; }
.tabela table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tabela th { position: sticky; top: 0; background: var(--painel); text-align: left; font-weight: 600; font-size: 12px; color: var(--fraco); padding: 9px 20px; border-bottom: 1px solid var(--linha); }
.tabela td { padding: 10px 20px; border-bottom: 1px solid var(--linha); white-space: nowrap; }
.tabela tbody tr { cursor: pointer; }
.tabela tbody tr:hover td { background: rgba(255,255,255,.025); }
.tabela tbody tr[aria-selected="true"] td { background: var(--acento-t); color: #fff; }
.tabela .c { text-align: center; }
.pe { display: flex; align-items: center; gap: 12px; padding: 10px 20px; border-top: 1px solid var(--linha); color: var(--suave); font-size: 13.5px; }
.pe .bt { margin-left: auto; }
.vazio-grande { display: grid; justify-items: center; gap: 6px; padding: 16vh 20px 40px; text-align: center; color: var(--suave); }
.vazio-grande svg { width: 40px; height: 40px; color: var(--fraco); }
.vazio-grande b { font-size: 18px; color: #fff; }

/* ---------- paineis encaixados ---------- */
.mesa { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 5px var(--col-dir, 44%); min-height: 0; }
.mesa.so-esq { grid-template-columns: minmax(0, 1fr) 0 0; }
.mesa.so-dir { grid-template-columns: 0 0 minmax(0, 1fr); }
.coluna { display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; }
.coluna-dir { display: grid; grid-template-rows: minmax(0, var(--lin-cima, 1fr)) 5px minmax(0, var(--lin-baixo, 1fr)); }
.coluna-dir.so-cima { grid-template-rows: minmax(0, 1fr) 0 0; }
.coluna-dir.so-baixo { grid-template-rows: 0 0 minmax(0, 1fr); }
.alca { background: var(--linha); position: relative; z-index: 3; }
.alca:hover, .alca.ativa { background: var(--acento); }
.alca-v { cursor: col-resize; } .alca-h { cursor: row-resize; }
.mesa.so-esq .alca, .mesa.so-dir .alca, .coluna-dir.so-cima .alca, .coluna-dir.so-baixo .alca { display: none; }
.dock { display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--painel); overflow: hidden; }
.dock.recolhido > .dock-corpo { display: none; }
.dock-cab { display: flex; align-items: center; height: 30px; flex: none; background: var(--cab); border-bottom: 1px solid var(--linha); padding-right: 6px; }
.dock-aba { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 9px 0 11px; font-size: 12px; font-weight: 600; color: #fff; background: var(--painel); box-shadow: inset 0 2px 0 var(--acento); border-right: 1px solid var(--linha); white-space: nowrap; }
.dock-aba button, .dock-ctl button { width: 22px; height: 22px; border: 0; background: none; color: var(--fraco); display: grid; place-items: center; border-radius: 4px; padding: 0; }
.dock-aba button:hover, .dock-ctl button:hover { color: #fff; background: rgba(255,255,255,.07); }
.dock-aba svg, .dock-ctl svg { width: 12px; height: 12px; }
.dock-ctl { margin-left: auto; display: flex; align-items: center; gap: 1px; color: var(--fraco); font-size: 11.5px; }
.dock-ctl .n { margin: 0 6px 0 1px; }
.dock.recolhido .dock-ctl .seta-rec svg { transform: rotate(-90deg); }
.dock-corpo { flex: 1; min-height: 0; overflow: auto; }
.mesa.max-um .dock:not(.maximizado) { display: none; }

/* tabuleiro */
.tab-dock .dock-corpo { display: flex; flex-direction: column; overflow: hidden; }
.tab-sub { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px; border-bottom: 1px solid var(--linha); flex: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; font-size: 12px; font-weight: 600; color: #fff; box-shadow: inset 0 -2px 0 var(--acento); max-width: 70%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip svg { width: 13px; height: 13px; color: var(--acento); }
.tab-sub .dir { margin-left: auto; display: flex; gap: 2px; }
.tab-sub .dir button { width: 26px; height: 24px; border: 0; background: none; color: var(--fraco); border-radius: 4px; display: grid; place-items: center; }
.tab-sub .dir button:hover { color: #fff; background: rgba(255,255,255,.07); }
.tab-sub .dir svg { width: 14px; height: 14px; }
.tab-area { flex: 1; min-height: 0; display: flex; justify-content: center; align-items: flex-start; padding: 10px 18px 8px; overflow: hidden; }
.tab-moldura { display: flex; flex-direction: column; gap: 8px; width: calc(var(--lado) + 26px); }
.tab-linha1 { display: flex; justify-content: space-between; align-items: center; padding-left: 26px; font-size: 12px; color: var(--fraco); }
.vez { display: inline-flex; align-items: center; gap: 7px; }
.vez i { width: 11px; height: 11px; border-radius: 2px; border: 1px solid rgba(255,255,255,.45); background: #f4f2ea; }
.vez i.p { background: #111; }
.jog { display: flex; align-items: center; gap: 9px; padding-left: 26px; min-height: 26px; }
.jog span.l { width: 24px; height: 24px; border-radius: 5px; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 12px; }
.jog b { font-size: 13.5px; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.jog small { color: var(--fraco); font-size: 12px; }

<script type="text/plain" id="codigo-motor">// ===== Nucleo de xadrez (regras, FEN, SAN, PGN) =====
// Tabuleiro 0x88: a8 = 0, h8 = 7, a1 = 112, h1 = 119.
const XADREZ = (() => {
  const INICIAL = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';
  const F_CAPT = 1, F_EP = 2, F_ROQUE_P = 4, F_ROQUE_G = 8, F_DUPLO = 16, F_PROMO = 32;
  const DESL = {
    n: [-33, -31, -18, -14, 14, 18, 31, 33],
    b: [-17, -15, 15, 17],
    r: [-16, -1, 1, 16],
    q: [-17, -16, -15, -1, 1, 15, 16, 17],
    k: [-17, -16, -15, -1, 1, 15, 16, 17],
  };
  const DIREITO = { 112: 2, 119: 1, 0: 8, 7: 4 }; // a1=Q(2) h1=K(1) a8=q(8) h8=k(4)

  const cor = (p) => (p === p.toUpperCase() ? 'w' : 'b');
  const tipo = (p) => p.toLowerCase();
  const coluna = (s) => s & 15;
  const linha = (s) => s >> 4;
  const nome = (s) => 'abcdefgh'[s & 15] + (8 - (s >> 4));
  const casa = (n) => (8 - parseInt(n[1], 10)) * 16 + (n.charCodeAt(0) - 97);

  class Posicao {
    tab                      ;
    vez     ;
    roque        ;
    ep      ;
    meio        ;
    numero        ;
    reis                      ;
    historico                                                                                                  ;
    constructor(fen         ) { this.carregar(fen || INICIAL); }

    carregar(fen) {
      const p = fen.trim().split(/\s+/);
      this.tab = new Array(128).fill(null);
      let s = 0;
      for (const ch of p[0]) {

    if (ctx.parou) return 0;
    if (prof <= 0) return quiesc(pos, alfa, beta, ctx, 0);

    let melhor = -INF;
    for (const m of L) {
      pos.fazer(m);
      const v = -buscar(pos, prof - 1, -beta, -alfa, ply + 1, ctx);
      pos.desfazer();
      if (ctx.parou) return 0;
      if (v > melhor) melhor = v;
      if (v > alfa) alfa = v;
      if (alfa >= beta) break;
    }
    return melhor;
  }

  function paraPlacar(v) {
    if (v > MATE - 1000) return { mate: Math.ceil((MATE - v) / 2) };
    if (v < -MATE + 1000) return { mate: -Math.ceil((MATE + v) / 2) };

        const v = -buscar(pos, d - 1, -INF, INF, 1, ctx);
        pos.desfazer();
        if (ctx.parou) break;
        notas.push({ m, v });
      }
      if (ctx.parou) break;
      notas.sort((a, b) => b.v - a.v);

      prof = d;
      ordemRaiz = notas.map((x) => x.m);

      prof,
      fim: null,
      linhas: resultado.slice(0, o.multipv).map(({ m, v }) => ({ uci: pos.uci(m), placar: paraPlacar(v) })),

  function disco(c,g,txt){

    return '<circle cx="22.5" cy="22.5" r="19.5" fill="'+f+'" stroke="'+s+'" stroke-width="1.6"/><text x="22.5" y="'+(txt?30:29.5)+'" text-anchor="middle" font-size="'+(txt?22:21)+'" '+
      (txt?'font-weight="700" fill="'+s+'" font-family="serif"':'font-family="Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif"')+'>'+g+'</text>';
  }
  function base(c,p){

    if(EMOJI[V.peca])return disco(c,EMOJI[V.peca].p[p],EMOJI[V.peca].txt);
    return ORIG[c+p]||'';
  }
  function peca(c,p){
    var cu=V.custom[c+p];if(!cu)return base(c,p);
    var o=typeof cu==='string'?{t:'i',d:cu}:cu;
    if(o.t==='m'){
      var m=MED[p],id='mc-'+c+p,ring=c==='w'?'#f3efe4':'#2b312d';
      return base(c,p)+'<clipPath id="'+id+'"><circle cx="'+m[0]+'" cy="'+m[1]+'" r="'+m[2]+'"/></clipPath><image href="'+o.d+'" x="'+(m[0]-m[2])+'" y="'+(m[1]-m[2])+'" width="'+m[2]*2+'" height="'+m[2]*2+'" preserveAspectRatio="xMidYMid slice" clip-path="url(#'+id+')"/><circle cx="'+m[0]+'" cy="'+m[1]+'" r="'+m[2]+'" fill="none" stroke="'+ring+'" stroke-width="1.6"/>';
    }
    return '<image href="'+o.d+'" x="0" y="0" width="45" height="45" preserveAspectRatio="xMidYMid meet"/>';
  }
  function aplicar(){capturar();['w','b'].forEach(function(c){PCS.forEach(function(p){var s=sim(c,p);if(s)s.innerHTML=peca(c,p);});});}
  function carregar(file,cb){
    var fr=new FileReader();
    fr.onload=function(){var im=new Image();im.onload=function(){cb(im);};im.onerror=function(){cb(null);};im.src=fr.result;};
    fr.onerror=function(){cb(null);};fr.readAsDataURL(file);
  }
  function quadrado(im,n){
    var c=document.createElement('canvas');c.width=c.height=n;var g=c.getContext('2d'),e=Math.max(n/im.width,n/im.height);
    g.drawImage(im,(n-im.width*e)/2,(n-im.height*e)/2,im.width*e,im.height*e);return c;
  }
  // a "ficha": a imagem recortada em circulo, com aro da cor do lado e um selo com o simbolo da peca
  function ficha(src,c,p,cb){
    var im=new Image();
    im.onload=function(){
      var cv=document.createElement('canvas');cv.width=cv.height=160;var g=cv.getContext('2d'),w=c==='w',cl=w?'#f3efe4':'#2b312d',es=w?'#2b312d':'#f3efe4';
      g.fillStyle=cl;g.beginPath();g.arc(80,80,76,0,7);g.fill();
      g.save();g.beginPath();g.arc(80,80,64,0,7);g.clip();g.drawImage(im,16,16,128,128);g.restore();
      g.lineWidth=7;g.strokeStyle=es;g.beginPath();g.arc(80,80,70,0,7);g.stroke();
      g.fillStyle=es;g.beginPath();g.arc(131,131,25,0,7);g.fill();
      g.fillStyle=cl;g.font='bold 34px serif';g.textAlign='center';g.textBaseline='middle';g.fillText(GLIFO[p],131,133);
      cb(cv.toDataURL('image/png'));
    };
    im.src=src;
  }
  function reconstruir(cb){
    V.custom={};var fila=[];
    Object.keys(V.fonte).forEach(function(p){V.cores.split('').forEach(function(c){fila.push([p,c]);});});
    var fim=function(){var ok=salvar();aplicar();if(cb)cb(ok);};
    if(!fila.length){fim();return;}
    var n=fila.length,um=function(){if(--n===0)fim();};
    fila.forEach(function(it){
      var p=it[0],c=it[1],src=V.fonte[p];
      if(V.estilo==='f')ficha(src,c,p,function(d){V.custom[c+p]={t:'f',d:d};um();});
      else{V.custom[c+p]={t:V.estilo==='m'?'m':'i',d:src};um();}
    });
  }
  function definir(p,file,cb){carregar(file,function(im){if(!im){cb(false);return;}V.fonte[p]=quadrado(im,128).toDataURL('image/png');reconstruir(cb);});}
  function remover(p,cb){delete V.fonte[p];reconstruir(cb);}
  function resetar(){V.peca='capivara';V.fonte={};V.custom={};salvar();aplicar();}
  return {V:V,PCS:PCS,NOMES:NOMES,LICHESS:LICHESS,EMOJI:EMOJI,CDN:CDN,ORIG:ORIG,disco:disco,aplicar:aplicar,salvar:salvar,recarregar:recarregar,definir:definir,remover:remover,reconstruir:reconstruir,resetar:resetar};
})();

<script>
(function(){

  function salvarAj(){try{localStorage.setItem(AJK,JSON.stringify(aj));}catch(e){}}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function $(i){return document.getElementById(i);}
  // ======== Stockfish ========
  var SF19='stockfish@19.0.1/bin/stockfish-19-lite-single',SF18='stockfish@18.0.8/bin/stockfish-18-lite-single',SF16='stockfish@16.0.0/src/stockfish-nnue-16-single';
  var ALVOS=[
    {nome:'Stockfish 19',js:'https://unpkg.com/'+SF19+'.js',wasm:'https://unpkg.com/'+SF19+'.wasm',limite:40000},
    {nome:'Stockfish 18',js:'https://unpkg.com/'+SF18+'.js',wasm:'https://unpkg.com/'+SF18+'.wasm',limite:40000},
    {nome:'Stockfish 16',js:'https://cdn.jsdelivr.net/npm/'+SF16+'.js',wasm:'https://cdn.jsdelivr.net/npm/'+SF16+'.wasm'},
    {nome:'Stockfish 16',js:'https://unpkg.com/'+SF16+'.js',wasm:'https://unpkg.com/'+SF16+'.wasm'},
    {nome:'Stockfish 10',js:'https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js'},
    {nome:'Stockfish 10',js:'https://cdn.jsdelivr.net/npm/stockfish.js@10.0.2/stockfish.js'}
  ];
  var sf={w:null,estado:'parado',nome:'',fila:[],atual:null,dog:0};
  function iniciar(alvo,limite){
    return new Promise(function(ok,falha){
      var w,t;
      try{
        if(typeof Worker==='undefined')throw new Error('sem Worker');
        var blob=new Blob(["try { importScripts('"+alvo.js+"'); } catch (e) { postMessage('ERRO_IMPORT ' + e.message); }"],{type:'application/javascript'});
        w=new Worker(URL.createObjectURL(blob)+(alvo.wasm?'#'+encodeURIComponent(alvo.wasm):''));
      }catch(e){falha(e);return;}
      t=setTimeout(function(){try{w.terminate();}catch(x){}falha(new Error('tempo esgotado'));},limite);
      w.onerror=function(e){clearTimeout(t);try{w.terminate();}catch(x){}falha(new Error('erro ao carregar'));};
      w.onmessage=function(e){
        var s=String(e.data);
        if(s.indexOf('ERRO_IMPORT')===0){clearTimeout(t);try{w.terminate();}catch(x){}falha(new Error(s));}
        else if(s.indexOf('uciok')===0){w.postMessage('setoption name Hash value 32');w.postMessage('isready');}
        else if(s.indexOf('readyok')===0){clearTimeout(t);ok(w);}
      };
      w.postMessage('uci');
    });
  }
  async function carregar(){
    if(sf.estado==='carregando'||sf.estado==='pronto')return;
    sf.estado='carregando';
    for(var i=0;i<ALVOS.length;i++){
      try{
        sf.w=await iniciar(ALVOS[i],ALVOS[i].limite||(ALVOS[i].wasm?12000:15000));
        sf.nome=ALVOS[i].nome;sf.estado='pronto';ligar();return;
      }catch(e){}
    }
    sf.estado='falhou';
  }
  function ligar(){
    sf.w.onmessage=function(e){
      var s=String(e.data),a=sf.atual;if(!a)return;
      if(s.indexOf('info')===0&&s.indexOf(' pv ')>0&&!/ (lower|upper)bound/.test(s)){
        var mp=+((/ multipv (\d+)/.exec(s)||[0,1])[1]),sc=/ score (cp|mate) (-?\d+)/.exec(s),pv=/ pv (\S+)/.exec(s),d=/ depth (\d+)/.exec(s);
        if(sc&&pv){a.linhas[mp-1]={uci:pv[1],placar:sc[1]==='cp'?{cp:+sc[2]}:{mate:+sc[2]}};if(d)a.prof=Math.max(a.prof,+d[1]);}
      }else if(s.indexOf('bestmove')===0){
        clearTimeout(sf.dog);sf.atual=null;
        var l=a.linhas.filter(Boolean),bm=s.split(' ')[1];
        if(!l.length&&bm&&bm!=='(none)')l=[{uci:bm,placar:{cp:0}}];
        a.ok({fen:a.fen,linhas:l,prof:a.prof});proximo();
      }
    };
    proximo();
  }
  function analisar(fen,op){
    return new Promise(function(ok){
      sf.fila.push({fen:fen,op:op||{},ok:ok,linhas:[],prof:0});
      if(sf.atual&&sf.w)sf.w.postMessage('stop');
      proximo();
    });
  }
  function proximo(){
    if(sf.atual||!sf.fila.length||sf.estado!=='pronto')return;
    var a=sf.atual=sf.fila.shift(),o=a.op,forte=(o.profMax||5)>=4;
    var ms=forte?[300,800,2000,5000][(aj.forca||2)-1]:Math.max(120,o.tempoMs||300);
    sf.w.postMessage('setoption name MultiPV value '+Math.max(1,Math.min(5,o.multipv||1)));
    sf.w.postMessage('setoption name Skill Level value '+(forte?20:(o.profMax<=2?3:8)));
    sf.w.postMessage('position fen '+a.fen);
    sf.w.postMessage('go movetime '+ms);
    sf.dog=setTimeout(function(){
      sf.estado='falhou';try{sf.w.terminate();}catch(x){}
      sf.atual=null;a.ok(null);
      sf.fila.splice(0).forEach(function(b){b.ok(null);});
    },ms+8000);
  }
  window.CSTUDIO_SF={
    pronto:function(){return sf.estado==='pronto';},
    usa:function(op){return aj.motor==='sf'&&sf.estado==='pronto'&&(!op||(op.profMax||5)>=2);},
    analisar:analisar
  };
  if(aj.motor==='sf')setTimeout(carregar,1200);
  // ======== partidas do Chess.com e do Lichess ========
  var RITMO={bullet:'bullet',ultraBullet:'bullet',blitz:'blitz',rapid:'rápida',classical:'clássica',daily:'diária',correspondence:'diária'};
  async function buscarChessCom(u){
    var r=await fetch('https://api.chess.com/pub/player/'+encodeURIComponent(u.toLowerCase())+'/games/archives');
    if(r.status===404)throw new Error('Não achei o usuário "'+u+'" no Chess.com. Confira o nome.');
    if(!r.ok)throw new Error('O Chess.com não respondeu agora. Tente de novo daqui a pouco.');
    var meses=((await r.json()).archives||[]).slice(-3).reverse(),jogos=[];
    for(var i=0;i<meses.length;i++){
      var m=await fetch(meses[i]);if(!m.ok)continue;
      jogos=jogos.concat(((await m.json()).games||[]).slice().reverse());
      if(jogos.length>=40)break;
    }
    return jogos.filter(function(j){return j.rules==='chess'&&j.pgn&&/\n\n1\./.test(j.pgn);}).slice(0,40).map(function(j){return{
      pgn:j.pgn,branco:j.white.username,preto:j.black.username,eloB:j.white.rating,eloP:j.black.rating,
      resultado:j.white.result==='win'?'1-0':j.black.result==='win'?'0-1':'1/2-1/2',
      ritmo:RITMO[j.time_class]||j.time_class||'',data:new Date((j.end_time||0)*1000)};});
  }
  async function buscarLichess(u){
    var r=await fetch('https://lichess.org/api/games/user/'+encodeURIComponent(u)+'?max=40&pgnInJson=true&clocks=false&evals=false&opening=false',{headers:{Accept:'application/x-ndjson'}});
    if(r.status===404)throw new Error('Não achei o usuário "'+u+'" no Lichess. Confira o nome.');
    if(r.status===429)throw new Error('O Lichess pediu para esperar um pouco. Tente de novo em 1 minuto.');
    if(!r.ok)throw new Error('O Lichess não respondeu agora. Tente de novo daqui a pouco.');
    var nome=function(p){return p.user?p.user.name:p.aiLevel?'Computador nível '+p.aiLevel:'Anônimo';};
    return(await r.text()).split('\n').filter(function(l){return l.trim();}).map(function(l){return JSON.parse(l);})
      .filter(function(g){return g.variant==='standard'&&g.pgn&&g.moves&&g.status!=='started'&&g.status!=='created';})
      .map(function(g){return{pgn:g.pgn,branco:nome(g.players.white),preto:nome(g.players.black),eloB:g.players.white.rating,eloP:g.players.black.rating,
        resultado:g.winner==='white'?'1-0':g.winner==='black'?'0-1':['draw','stalemate'].indexOf(g.status)>=0?'1/2-1/2':'*',
        ritmo:RITMO[g.speed]||g.speed||'',data:new Date(g.createdAt||0)};});
  }
  var jogosBusca=[];
  function dcurta(d){return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0');}
  // ======== banco de dados do Lichess (aberturas e finais) ========

  async function consultar(fen,box){

      if(pecas<=7){
        var t=await fetch('https://tablebase.lichess.ovh/standard?fen='+encodeURIComponent(fen));
        if(t.ok){var d=await t.json();corpo+='<div class="bn-msg"><b>'+esc(CAT[d.category]||'Final conhecido')+'</b>'+(d.moves&&d.moves[0]?' · melhor lance: '+esc(d.moves[0].san):'')+'</div>';}
      }
      if(!aj.token){pinta(corpo+'<div class="bn-msg">Para ver as aberturas, coloque o seu token do Lichess em Ajustes.</div>');return;}
      var url='https://explorer.lichess.ovh/'+(aj.tipo==='mestres'?'masters':'lichess')+'?topGames=0&recentGames=0&moves=8&fen='+encodeURIComponent(fen);
      var r=await fetch(url,{headers:{Authorization:'Bearer '+aj.token}});

      }).join('')+'<div class="bn-msg" style="margin-top:6px">'+(tot>=1000?Math.round(tot/1000)+' mil':tot)+' partidas nesta posição</div>';

        AM.comecou=true;
        lances.forEach(function(u){var pos=C.posAtual(),m=pos.lanceUci(u);if(m)C.jogarLance(pos,m,false);});
        C.st.jogo.cab={White:cor==='w'?nomeEu():(AM.oponente||'Amigo'),Black:cor==='b'?nomeEu():(AM.oponente||'Amigo')};
      }
      AM.comecou=true;C.atualizarMesa();painel();
    });
  }
  function ucis(){var C=window.CSTUDIO;return C.st.jogo.lances.map(function(l){return l.uci;});}
  function recebe(ev,p){
    if(!AM)return;var C=window.CSTUDIO;
    if(ev==='ola'){
      if(p.p==='g'&&AM.papel==='h'){AM.oponente=p.n||'Amigo';AM.env('comeca',{cor:AM.cor==='w'?'b':'w',n:nomeEu(),l:AM.comecou?ucis():[]});if(!AM.comecou)iniciar(AM.cor,[]);else painel();}
      else if(p.p==='h'&&AM.papel==='g'){AM.oponente=p.n||'Amigo';AM.env('ola',{p:'g',n:nomeEu()});}
    }else if(ev==='comeca'&&AM.papel==='g'){AM.oponente=p.n||'Amigo';iniciar(p.cor,p.l||[]);}
    else if(ev==='mv'&&AM.comecou&&!AM.fim){
      if(C.st.jogo.lances.length>=p.k)return;
      C.st.jogo.ply=C.st.jogo.lances.length;var pos=C.posAtual();if(pos.vez===AM.cor)return;
      var m=pos.lanceUci(p.u);if(m)C.jogarLance(pos,m,false);
    }else if(ev==='desiste'&&!AM.fim)terminar('Seu amigo desistiu. Você venceu!',true,false,AM.cor==='w'?'1-0':'0-1');
    else if(ev==='emp'){
      if(p.a==='prop'){AM.ofertaRecebida=true;painel();}
      else if(p.a==='ok'&&!AM.fim)terminar('Empate por acordo.',false,true,'1/2-1/2');
      else if(p.a==='nao'){AM.ofertaEnviada=false;toast('Seu amigo recusou o empate.');painel();}
    }
  }
  function terminar(txt,ganhou,empate,res){
    var C=window.CSTUDIO;if(!AM||AM.fim)return;
    AM.fim=true;C.st.jogoAtivo=false;C.st.jogoFim={ganhou:ganhou,empate:empate,txt:txt};
    C.st.jogo.cab={White:AM.cor==='w'?nomeEu():(AM.oponente||'Amigo'),Black:AM.cor==='b'?nomeEu():(AM.oponente||'Amigo'),Result:res};
    try{C.guardarMinha(C.gerarPgn());}catch(e){}
    painel();C.atualizarMesa();
  }
  function sair(){if(AM){AM.saiu=true;try{AM.ws.close();}catch(e){}clearInterval(AM.hb);}AM=null;var C=window.CSTUDIO;if(C){C.st.jogoAtivo=false;C.st.jogoFim=null;C.desenharPainelJogo();}}
  window.CSTUDIO_AMIGO={
    ativo:function(){return !!(AM&&AM.comecou);},
    pode:function(pos){var C=window.CSTUDIO;return !AM||(AM.comecou&&!AM.fim&&pos.vez===AM.cor&&C.st.jogo.ply===C.st.jogo.lances.length);},
    enviar:function(uci){if(AM&&AM.env)AM.env('mv',{u:uci,k:window.CSTUDIO.st.jogo.lances.length+1});},
    depois:function(){
      var C=window.CSTUDIO,pos=C.posAtual(),fim=pos.fimDeJogo();
      if(fim){
        if(fim==='mate'){var v=pos.vez!==AM.cor;terminar(v?'Xeque-mate. Você venceu!':'Xeque-mate. Seu amigo venceu.',v,false,pos.vez==='w'?'0-1':'1-0');}
        else terminar('Empate.',false,true,'1/2-1/2');
        return;
      }
      painel();
    },
    painel:function(){return painel();}
  };
  function painel(){
    var el=$('corpo-jogo'),C=window.CSTUDIO;if(!el||!AM||!C)return false;
    var op=esc(AM.oponente||'Seu amigo'),h='<div class="caixa"><div class="adv"><span class="ic">♟</span><span><b>'+op+'</b><small>',pos=null;
    try{pos=C.posAtual();}catch(e){}
    if(AM.erro)h+='sem conexão</small></span></div><div class="destaque errado"><small>Desafio</small><h2>'+esc(AM.erro)+'</h2></div><div class="acoes" style="margin:0"><button type="button" class="bt" data-am="sair">Voltar</button></div></div>';
    else if(!AM.entrou)h+='conectando…</small></span></div><p class="motor-pe">Entrando na sala do desafio…</p><div class="acoes" style="margin:0"><button type="button" class="bt" data-am="sair">Cancelar</button></div></div>';
    else if(!AM.comecou){
      if(AM.papel==='h')h+='esperando o amigo</small></span></div><div class="destaque"><small>Código do desafio</small><h2 style="letter-spacing:.14em">'+esc(AM.sala)+'</h2></div><p class="motor-pe">Mande este link para o seu amigo. A partida começa quando ele abrir:<br><b style="word-break:break-all">'+esc(link())+'</b></p><div class="acoes" style="margin:0"><button type="button" class="bt prim" data-am="copiar">Copiar link</button><button type="button" class="bt" data-am="compartilhar">Compartilhar</button><button type="button" class="bt" data-am="sair">Cancelar</button></div></div>';
      else h+='conectado</small></span></div><p class="motor-pe">Esperando o criador do desafio…</p><div class="acoes" style="margin:0"><button type="button" class="bt" data-am="sair">Sair</button></div></div>';
    }else if(AM.fim){
      var f=C.st.jogoFim||{};
      h+='partida encerrada</small></span></div><div class="destaque '+(f.ganhou?'certo':f.empate?'':'errado')+'"><small>Fim de jogo</small><h2>'+esc(f.txt||'')+'</h2></div><div class="acoes" style="margin:0"><button type="button" class="bt prim" data-am="analisar">Analisar a partida</button><button type="button" class="bt" data-am="sair">Novo desafio</button></div></div>';
    }else{
      var vez=pos&&pos.vez===AM.cor;
      h+=(AM.caiu?'reconectando…':vez?'sua vez':'vez do seu amigo')+' · você joga de '+(AM.cor==='w'?'brancas':'pretas')+'</small></span></div>';
      if(AM.ofertaRecebida)h+='<div class="destaque"><small>Seu amigo propôs empate</small><div class="acoes" style="margin:8px 0 0"><button type="button" class="bt prim" data-am="aceitar">Aceitar</button><button type="button" class="bt" data-am="recusar">Recusar</button></div></div>';
      else h+='<div class="destaque"><small>'+(vez?'Sua vez':'Aguardando o lance do amigo')+'</small><h2>'+(vez?'Jogue no tabuleiro':'…')+'</h2></div>';
      h+='<div class="acoes" style="margin:0"><button type="button" class="bt"'+(AM.ofertaEnviada?' disabled':'')+' data-am="empate">'+(AM.ofertaEnviada?'Empate proposto':'Propor empate')+'</button><button type="button" class="bt" data-am="desistir">Desistir</button></div></div>';
    }
    el.innerHTML=h;return true;
  }
  function setup(){
    var el=$('corpo-jogo');if(!el||AM)return;
    var C=window.CSTUDIO;if(!C||C.st.jogoAtivo||C.st.jogoFim)return;
    var cx=el.querySelector('.caixa');if(!cx||$('am-ini'))return;
    var s=document.createElement('section');s.id='am-ini';s.className='aj-sec';
    s.innerHTML='<h3 class="rotulo">Desafiar um amigo</h3><div class="aj-linha"><select id="am-cor"><option value="r">Cor sorteada</option><option value="w">Eu jogo de brancas</option><option value="b">Eu jogo de pretas</option></select><button type="button" class="bt prim" data-am="criar">Criar desafio</button></div>'+
      '<div class="aj-linha"><input id="am-cod" type="text" placeholder="Código do amigo" maxlength="8" autocomplete="off" autocapitalize="characters" spellcheck="false"><button type="button" class="bt" data-am="entrar">Entrar</button></div>';
    cx.appendChild(s);
  }
  setInterval(setup,500);
  document.addEventListener('click',function(e){
    var b=e.target.closest&&e.target.closest('[data-am]');if(!b)return;
    var a=b.getAttribute('data-am'),C=window.CSTUDIO;
    if(a==='criar'){
      var c=$('am-cor').value;if(c==='r')c=Math.random()<.5?'w':'b';
      AM={sala:codigo(),papel:'h',cor:c};conectar();painel();
    }else if(a==='entrar'){
      var cod=(($('am-cod')||{}).value||'').trim().toUpperCase();
      if(!/^[A-Z0-9]{4,8}$/.test(cod)){toast('Digite o código do desafio.');return;}
      AM={sala:cod,papel:'g'};conectar();painel();
    }else if(a==='copiar'){
      (navigator.clipboard?navigator.clipboard.writeText(link()):Promise.reject()).then(function(){toast('Link copiado.');},function(){toast('Copie o link na tela.');});
    }else if(a==='compartilhar'){
      if(navigator.share)navigator.share({title:'Desafio de xadrez',text:'Vem jogar xadrez comigo no Capivara!',url:link()}).catch(function(){});
      else(navigator.clipboard?navigator.clipboard.writeText(link()):Promise.reject()).then(function(){toast('Link copiado.');},function(){});
    }else if(a==='sair')sair();
    else if(a==='desistir'){if(confirm('Desistir da partida?')){AM.env('desiste');terminar('Você desistiu. Seu amigo venceu.',false,false,AM.cor==='w'?'0-1':'1-0');}}
    else if(a==='empate'){AM.ofertaEnviada=true;AM.env('emp',{a:'prop'});painel();}
    else if(a==='aceitar'){AM.env('emp',{a:'ok'});terminar('Empate por acordo.',false,true,'1/2-1/2');}
    else if(a==='recusar'){AM.ofertaRecebida=false;AM.env('emp',{a:'nao'});painel();}
    else if(a==='analisar'){var j=C.st;j.modo='estudo';sair0();C.ir('analisar');}
    function sair0(){if(AM){AM.saiu=true;try{AM.ws.close();}catch(x){}clearInterval(AM.hb);}AM=null;}
  });
  // quem abre o link do amigo entra direto no desafio
  var mh=/^#desafio=([A-Za-z0-9]{4,8})/.exec(location.hash);
  if(mh){
    var cod=mh[1].toUpperCase(),t0=0,w=setInterval(function(){
      t0+=300;
      if(window.CSTUDIO&&!$('abertura')){clearInterval(w);history.replaceState(null,'','#biblioteca');
        window.CSTUDIO.ir('jogar');setTimeout(function(){AM={sala:cod,papel:'g'};conectar();painel();},400);}
      else if(t0>10000)clearInterval(w);
    },300);
  }
})();
</script>
</body>
</html>
