# Gera o instalador do Capivara para Windows nos computadores do GitHub (nada precisa ser instalado no seu PC).
# Roda sozinho quando muda algo no app ou no site, ou na mao em Actions > "App Windows" > Run workflow.
name: App Windows

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'index.html'
      - 'en.html'
      - '.github/workflows/app-windows.yml'

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Usa o site mais novo do repositorio (se tiver)
        shell: pwsh
        run: |
          foreach ($f in 'index.html', 'en.html') {
            if (Test-Path $f) { Copy-Item $f app/site/ -Force; Write-Host "copiado $f" }
          }

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Instala o Tauri
        run: cargo install tauri-cli --version "^2.0.0" --locked

      - name: Gera o instalador
        working-directory: app/src-tauri
        run: cargo tauri build

      - name: Da um nome fixo ao instalador
        shell: pwsh
        run: Copy-Item (Get-ChildItem app/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1).FullName Capivara-Setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: Capivara-instalador-windows
          path: Capivara-Setup.exe

      # publica numa "Release": o link .../releases/latest/download/Capivara-Setup.exe sempre baixa o mais novo
      - name: Publica para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-${{ github.run_number }}
          name: Capivara para Windows (versão ${{ github.run_number }})
          body: Instalador do Capivara para Windows. Baixe o Capivara-Setup.exe abaixo.
          files: Capivara-Setup.exe
          make_latest: true
